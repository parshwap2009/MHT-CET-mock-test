
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MHT-CET Mock Test</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- YOUR SUPABASE CONFIG -->
    <script src="config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #172033;
        }

        .header {
            background: #182848;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 21px;
        }

        .timer {
            background: #fff;
            color: #182848;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 20px;
        }

        .loading {
            background: white;
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            margin-top: 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .loading h2 {
            margin-bottom: 12px;
        }

        .error-box {
            background: #fff0f0;
            border: 1px solid #ffb5b5;
            color: #a00000;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            line-height: 1.6;
        }

        .test-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        .question-card,
        .sidebar-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .question-card {
            padding: 25px;
            min-height: 500px;
        }

        .question-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }

        .question-number {
            font-size: 18px;
            font-weight: bold;
        }

        .subject {
            padding: 6px 12px;
            background: #eef2ff;
            color: #3048a8;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .question-text {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 25px;
            white-space: pre-wrap;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .option {
            border: 2px solid #ddd;
            padding: 15px;
            border-radius: 9px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
        }

        .option:hover {
            border-color: #5968ff;
            background: #f5f6ff;
        }

        .option.selected {
            border-color: #3048a8;
            background: #eef2ff;
        }

        .option-label {
            font-weight: bold;
            margin-right: 8px;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-primary {
            background: #3048a8;
            color: white;
        }

        .btn-secondary {
            background: #e8ebf2;
            color: #172033;
        }

        .btn-warning {
            background: #ffb020;
            color: #111;
        }

        .btn-danger {
            background: #e53935;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sidebar-card {
            padding: 18px;
            height: fit-content;
            position: sticky;
            top: 90px;
        }

        .sidebar-card h3 {
            margin-bottom: 15px;
        }

        .palette {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
            margin-bottom: 20px;
        }

        .palette button {
            padding: 9px 5px;
            background: #eee;
            color: #333;
        }

        .palette button.current {
            background: #3048a8;
            color: white;
        }

        .palette button.answered {
            background: #2e9d55;
            color: white;
        }

        .palette button.review {
            background: #ffb020;
            color: #111;
        }

        .legend {
            font-size: 13px;
            line-height: 2;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .legend span {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            margin-right: 5px;
        }

        .legend-current {
            background: #3048a8;
        }

        .legend-answered {
            background: #2e9d55;
        }

        .legend-review {
            background: #ffb020;
        }

        .legend-unanswered {
            background: #eee;
            border: 1px solid #bbb;
        }

        .result-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        .result-box {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }

        .result-box h2 {
            margin-bottom: 20px;
        }

        .score {
            font-size: 45px;
            font-weight: bold;
            color: #3048a8;
            margin-bottom: 20px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .result-item {
            background: #f3f6fb;
            padding: 15px;
            border-radius: 8px;
        }

        .result-item strong {
            display: block;
            font-size: 22px;
            margin-bottom: 5px;
        }

        @media(max-width: 850px) {
            .test-layout {
                grid-template-columns: 1fr;
            }

            .sidebar-card {
                position: static;
            }

            .question-text {
                font-size: 17px;
            }

            .header h1 {
                font-size: 16px;
            }

            .timer {
                font-size: 14px;
                padding: 8px 12px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1 id="testTitle">MHT-CET Mock Test</h1>
    <div class="timer" id="timer">--:--:--</div>
</header>

<div class="container">

    <!-- LOADING -->
    <div id="loadingBox" class="loading">
        <h2>Loading Test...</h2>
        <p>Please wait while the questions are loading.</p>
    </div>

    <!-- ERROR -->
    <div id="errorBox" class="error-box" style="display:none;">
        <h2>Unable to Load Test</h2>
        <p id="errorMessage"></p>

        <br>

        <button class="btn-secondary" onclick="location.href='dashboard.html'">
            Back to Dashboard
        </button>
    </div>

    <!-- TEST -->
    <div id="testArea" style="display:none;">

        <div class="test-layout">

            <main class="question-card">

                <div class="question-top">
                    <div class="question-number" id="questionNumber">
                        Question 1
                    </div>

                    <div class="subject" id="subject">
                        Physics
                    </div>
                </div>

                <div class="question-text" id="questionText"></div>

                <div class="options" id="optionsContainer"></div>

                <div class="buttons">

                    <button
                        class="btn-secondary"
                        id="previousBtn"
                        onclick="previousQuestion()">
                        ← Previous
                    </button>

                    <button
                        class="btn-warning"
                        onclick="toggleReview()">
                        Mark for Review
                    </button>

                    <button
                        class="btn-secondary"
                        onclick="clearAnswer()">
                        Clear Answer
                    </button>

                    <button
                        class="btn-primary"
                        id="nextBtn"
                        onclick="nextQuestion()">
                        Next →
                    </button>

                </div>

                <div style="text-align:right; margin-top:20px;">
                    <button
                        class="btn-danger"
                        onclick="confirmSubmit()">
                        Submit Test
                    </button>
                </div>

            </main>

            <aside class="sidebar-card">

                <h3>Questions</h3>

                <div id="palette" class="palette"></div>

                <div class="legend">
                    <div>
                        <span class="legend-current"></span>
                        Current
                    </div>

                    <div>
                        <span class="legend-answered"></span>
                        Answered
                    </div>

                    <div>
                        <span class="legend-review"></span>
                        Marked for Review
                    </div>

                    <div>
                        <span class="legend-unanswered"></span>
                        Not Answered
                    </div>
                </div>

            </aside>

        </div>

    </div>
</div>

<!-- RESULT -->
<div class="result-overlay" id="resultOverlay">

    <div class="result-box">

        <h2>Test Submitted</h2>

        <div class="score" id="finalScore">0</div>

        <p id="scoreText"></p>

        <div class="result-grid">

            <div class="result-item">
                <strong id="correctCount">0</strong>
                Correct
            </div>

            <div class="result-item">
                <strong id="wrongCount">0</strong>
                Wrong
            </div>

            <div class="result-item">
                <strong id="unansweredCount">0</strong>
                Unanswered
            </div>

        </div>

        <button
            class="btn-primary"
            onclick="location.href='dashboard.html'">
            Back to Dashboard
        </button>

    </div>

</div>

<script>

    /* =========================================================
       SUPABASE
    ========================================================= */

    let supabaseClient;

    try {

        if (
            typeof SUPABASE_URL === "undefined" ||
            typeof SUPABASE_ANON_KEY === "undefined"
        ) {
            throw new Error(
                "Supabase configuration was not found. Check ./js/config.js"
            );
        }

        supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

    } catch (error) {

        showError(
            "Supabase configuration error: " + error.message
        );

    }


    /* =========================================================
       GLOBAL VARIABLES
    ========================================================= */

    let currentUser = null;
    let profile = null;

    let test = null;
    let questions = [];

    let currentQuestionIndex = 0;

    let answers = {};
    let markedForReview = {};

    let attemptId = null;

    let remainingSeconds = 0;
    let timerInterval = null;

    let submitting = false;


    /* =========================================================
       GET TEST ID
    ========================================================= */

    function getTestId() {

        const params = new URLSearchParams(
            window.location.search
        );

        let testId = params.get("test_id");

        if (!testId) {
            testId = localStorage.getItem("selected_test_id");
        }

        return testId;
    }


    /* =========================================================
       INITIALIZE
    ========================================================= */

    async function initializeTest() {

        try {

            if (!supabaseClient) {
                return;
            }

            console.log("Starting test initialization...");

            /* -------------------------
               GET TEST ID
            ------------------------- */

            const testId = getTestId();

            console.log("Test ID:", testId);

            if (!testId) {

                throw new Error(
                    "No test ID was found. Please go back to the dashboard and click Start Test again."
                );

            }


            /* -------------------------
               CHECK LOGIN
            ------------------------- */

            const {
                data: sessionData,
                error: sessionError
            } = await supabaseClient.auth.getSession();

            if (sessionError) {
                throw sessionError;
            }

            if (
                !sessionData ||
                !sessionData.session ||
                !sessionData.session.user
            ) {

                window.location.href = "login.html";
                return;

            }

            currentUser = sessionData.session.user;

            console.log(
                "Logged in user:",
                currentUser.email
            );


            /* -------------------------
               LOAD PROFILE
            ------------------------- */

            const {
                data: profileData,
                error: profileError
            } = await supabaseClient
                .from("profiles")
                .select("id, full_name, email, role")
                .eq("id", currentUser.id)
                .maybeSingle();

            if (profileError) {

                console.warn(
                    "Profile warning:",
                    profileError
                );

            } else {

                profile = profileData;

            }


            /* -------------------------
               LOAD TEST
            ------------------------- */

            console.log(
                "Loading mock_tests...",
                testId
            );

            const {
                data: testData,
                error: testError
            } = await supabaseClient
                .from("mock_tests")
                .select("*")
                .eq("id", testId)
                .eq("is_active", true)
                .maybeSingle();

            if (testError) {

                throw new Error(
                    "Could not load the test from Supabase: " +
                    testError.message
                );

            }

            if (!testData) {

                throw new Error(
                    "Test not found. Check that this test exists in the mock_tests table and that is_active is set to true."
                );

            }

            test = testData;

            console.log(
                "Test loaded:",
                test
            );


            /* -------------------------
               SHOW TEST TITLE
            ------------------------- */

            document.getElementById(
                "testTitle"
            ).textContent = test.title;


            /* -------------------------
               LOAD QUESTIONS
            ------------------------- */

            console.log(
                "Loading questions for test_id:",
                test.id
            );

            const {
                data: questionData,
                error: questionError
            } = await supabaseClient
                .from("questions")
                .select(`
                    id,
                    test_id,
                    subject,
                    question_text,
                    option_a,
                    option_b,
                    option_c,
                    option_d,
                    correct_option,
                    marks,
                    explanation
                `)
                .eq("test_id", test.id)
                .order("id", {
                    ascending: true
                });

            if (questionError) {

                throw new Error(
                    "Could not load questions from Supabase: " +
                    questionError.message
                );

            }

            questions = questionData || [];

            console.log(
                "Questions loaded:",
                questions.length
            );


            /* -------------------------
               NO QUESTIONS
            ------------------------- */

            if (questions.length === 0) {

                throw new Error(
                    "This test has no questions. Open Supabase → Table Editor → questions and make sure questions exist with test_id = " +
                    test.id
                );

            }


            /* -------------------------
               LIMIT TO TEST QUESTION COUNT
               ------------------------- */

            if (
                test.total_questions &&
                Number(test.total_questions) > 0
            ) {

                questions = questions.slice(
                    0,
                    Number(test.total_questions)
                );

            }


            /* -------------------------
               CREATE ATTEMPT
            ------------------------- */

            const {
                data: attemptData,
                error: attemptError
            } = await supabaseClient
                .from("test_attempts")
                .insert({
                    user_id: currentUser.id,
                    test_id: test.id,
                    score: 0,
                    correct_answers: 0,
                    wrong_answers: 0,
                    unanswered: questions.length,
                    total_questions: questions.length,
                    started_at: new Date().toISOString()
                })
                .select()
                .single();

            if (attemptError) {

                console.warn(
                    "Attempt could not be created:",
                    attemptError
                );

                /*
                   The test can still be taken.
                   We don't stop the test here.
                */

                attemptId = null;

            } else {

                attemptId = attemptData.id;

                console.log(
                    "Attempt created:",
                    attemptId
                );

            }


            /* -------------------------
               TIMER
            ------------------------- */

            const durationMinutes =
                Number(test.duration_minutes) || 180;

            remainingSeconds =
                durationMinutes * 60;

            startTimer();


            /* -------------------------
               CREATE ANSWER OBJECT
            ------------------------- */

            questions.forEach(function(question) {

                answers[question.id] = null;
                markedForReview[question.id] = false;

            });


            /* -------------------------
               DISPLAY TEST
            ------------------------- */

            document.getElementById(
                "loadingBox"
            ).style.display = "none";

            document.getElementById(
                "testArea"
            ).style.display = "block";

            renderPalette();

            renderQuestion();

            console.log(
                "Test loaded successfully."
            );

        } catch (error) {

            console.error(
                "TEST INITIALIZATION ERROR:",
                error
            );

            showError(
                error.message ||
                "An unknown error occurred while loading the test."
            );

        }

    }


    /* =========================================================
       RENDER QUESTION
    ========================================================= */

    function renderQuestion() {

        if (!questions.length) {
            return;
        }

        const question =
            questions[currentQuestionIndex];

        document.getElementById(
            "questionNumber"
        ).textContent =
            "Question " +
            (currentQuestionIndex + 1) +
            " of " +
            questions.length;

        document.getElementById(
            "subject"
        ).textContent =
            question.subject || "General";

        document.getElementById(
            "questionText"
        ).textContent =
            question.question_text || "";


        const optionsContainer =
            document.getElementById(
                "optionsContainer"
            );

        optionsContainer.innerHTML = "";


        const options = [
            {
                letter: "A",
                text: question.option_a
            },
            {
                letter: "B",
                text: question.option_b
            },
            {
                letter: "C",
                text: question.option_c
            },
            {
                letter: "D",
                text: question.option_d
            }
        ];


        options.forEach(function(option) {

            const div =
                document.createElement("div");

            div.className = "option";


            if (
                answers[question.id] ===
                option.letter
            ) {

                div.classList.add("selected");

            }


            div.innerHTML =
                '<span class="option-label">' +
                option.letter +
                ".</span>" +
                escapeHtml(option.text || "");


            div.onclick = function() {

                selectAnswer(
                    question.id,
                    option.letter
                );

            };


            optionsContainer.appendChild(div);

        });


        document.getElementById(
            "previousBtn"
        ).disabled =
            currentQuestionIndex === 0;


        const nextButton =
            document.getElementById(
                "nextBtn"
            );

        if (
            currentQuestionIndex ===
            questions.length - 1
        ) {

            nextButton.textContent =
                "Finish →";

        } else {

            nextButton.textContent =
                "Next →";

        }


        renderPalette();

    }


    /* =========================================================
       SELECT ANSWER
    ========================================================= */

    function selectAnswer(
        questionId,
        option
    ) {

        answers[questionId] = option;

        renderQuestion();

    }


    /* =========================================================
       CLEAR ANSWER
    ========================================================= */

    function clearAnswer() {

        const question =
            questions[currentQuestionIndex];

        if (!question) {
            return;
        }

        answers[question.id] = null;

        renderQuestion();

    }


    /* =========================================================
       MARK REVIEW
    ========================================================= */

    function toggleReview() {

        const question =
            questions[currentQuestionIndex];

        if (!question) {
            return;
        }

        markedForReview[question.id] =
            !markedForReview[question.id];

        renderPalette();

    }


    /* =========================================================
       NEXT
    ========================================================= */

    function nextQuestion() {

        if (
            currentQuestionIndex <
            questions.length - 1
        ) {

            currentQuestionIndex++;

            renderQuestion();

        } else {

            confirmSubmit();

        }

    }


    /* =========================================================
       PREVIOUS
    ========================================================= */

    function previousQuestion() {

        if (
            currentQuestionIndex > 0
        ) {

            currentQuestionIndex--;

            renderQuestion();

        }

    }


    /* =========================================================
       PALETTE
    ========================================================= */

    function renderPalette() {

        const palette =
            document.getElementById(
                "palette"
            );

        palette.innerHTML = "";


        questions.forEach(
            function(question, index) {

                const button =
                    document.createElement("button");

                button.textContent =
                    index + 1;


                if (
                    index ===
                    currentQuestionIndex
                ) {

                    button.classList.add(
                        "current"
                    );

                } else if (
                    markedForReview[question.id]
                ) {

                    button.classList.add(
                        "review"
                    );

                } else if (
                    answers[question.id]
                ) {

                    button.classList.add(
                        "answered"
                    );

                }


                button.onclick =
                    function() {

                        currentQuestionIndex =
                            index;

                        renderQuestion();

                    };


                palette.appendChild(
                    button
                );

            }
        );

    }


    /* =========================================================
       TIMER
    ========================================================= */

    function startTimer() {

        updateTimerDisplay();


        clearInterval(timerInterval);


        timerInterval =
            setInterval(
                function() {

                    remainingSeconds--;

                    updateTimerDisplay();


                    if (
                        remainingSeconds <= 0
                    ) {

                        clearInterval(
                            timerInterval
                        );

                        alert(
                            "Time is over. Your test will be submitted automatically."
                        );

                        submitTest();

                    }

                },
                1000
            );

    }


    function updateTimerDisplay() {

        const hours =
            Math.floor(
                remainingSeconds / 3600
            );

        const minutes =
            Math.floor(
                (remainingSeconds % 3600) / 60
            );

        const seconds =
            remainingSeconds % 60;


        document.getElementById(
            "timer"
        ).textContent =
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0");

    }


    /* =========================================================
       CONFIRM SUBMIT
    ========================================================= */

    function confirmSubmit() {

        const answered =
            Object.values(answers)
                .filter(
                    value => value !== null
                )
                .length;

        const unanswered =
            questions.length -
            answered;


        const message =
            "Are you sure you want to submit?\n\n" +
            "Total questions: " +
            questions.length +
            "\nAnswered: " +
            answered +
            "\nUnanswered: " +
            unanswered;


        if (confirm(message)) {

            submitTest();

        }

    }


    /* =========================================================
       SUBMIT TEST
    ========================================================= */

    async function submitTest() {

        if (submitting) {
            return;
        }

        submitting = true;

        clearInterval(timerInterval);


        try {

            let correct = 0;
            let wrong = 0;
            let unanswered = 0;

            let score = 0;


            questions.forEach(
                function(question) {

                    const selected =
                        answers[question.id];


                    if (!selected) {

                        unanswered++;

                        return;

                    }


                    if (
                        selected ===
                        question.correct_option
                    ) {

                        correct++;

                        score +=
                            Number(
                                question.marks || 1
                            );

                    } else {

                        wrong++;

                    }

                }
            );


            /* -------------------------
               UPDATE ATTEMPT
            ------------------------- */

            if (attemptId) {

                const {
                    error: updateError
                } = await supabaseClient
                    .from("test_attempts")
                    .update({
                        score: score,
                        correct_answers: correct,
                        wrong_answers: wrong,
                        unanswered: unanswered,
                        total_questions: questions.length,
                        submitted_at:
                            new Date().toISOString()
                    })
                    .eq("id", attemptId);


                if (updateError) {

                    console.error(
                        "Attempt update error:",
                        updateError
                    );

                }


                /* -------------------------
                   SAVE ANSWERS
                   ------------------------- */

                const answerRows =
                    questions.map(
                        function(question) {

                            const selected =
                                answers[question.id];

                            const isCorrect =
                                selected
                                ? selected ===
                                  question.correct_option
                                : false;

                            const marksObtained =
                                isCorrect
                                ? Number(
                                    question.marks || 1
                                  )
                                : 0;


                            return {
                                attempt_id:
                                    attemptId,

                                question_id:
                                    question.id,

                                selected_option:
                                    selected,

                                is_correct:
                                    isCorrect,

                                marks_obtained:
                                    marksObtained
                            };

                        }
                    );


                if (
                    answerRows.length > 0
                ) {

                    const {
                        error: answerError
                    } = await supabaseClient
                        .from("attempt_answers")
                        .upsert(
                            answerRows,
                            {
                                onConflict:
                                    "attempt_id,question_id"
                            }
                        );


                    if (answerError) {

                        console.error(
                            "Answer save error:",
                            answerError
                        );

                    }

                }

            }


            /* -------------------------
               SHOW RESULT
            ------------------------- */

            document.getElementById(
                "finalScore"
            ).textContent =
                score;


            document.getElementById(
                "scoreText"
            ).textContent =
                "You scored " +
                score +
                " marks out of the maximum available marks.";


            document.getElementById(
                "correctCount"
            ).textContent =
                correct;


            document.getElementById(
                "wrongCount"
            ).textContent =
                wrong;


            document.getElementById(
                "unansweredCount"
            ).textContent =
                unanswered;


            document.getElementById(
                "resultOverlay"
            ).style.display =
                "flex";


        } catch (error) {

            console.error(
                "SUBMIT ERROR:",
                error
            );

            alert(
                "Test was calculated, but there was a problem saving the result:\n\n" +
                error.message
            );

        } finally {

            submitting = false;

        }

    }


    /* =========================================================
       ERROR DISPLAY
    ========================================================= */

    function showError(message) {

        console.error(
            "DISPLAYED ERROR:",
            message
        );


        const loadingBox =
            document.getElementById(
                "loadingBox"
            );

        const errorBox =
            document.getElementById(
                "errorBox"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        if (loadingBox) {

            loadingBox.style.display =
                "none";

        }


        if (errorMessage) {

            errorMessage.textContent =
                message;

        }


        if (errorBox) {

            errorBox.style.display =
                "block";

        }

    }


    /* =========================================================
       HTML ESCAPE
    ========================================================= */

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text;

        return div.innerHTML;

    }


    /* =========================================================
       START
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            initializeTest();

        }
    );

</script>

</body>
</html>
