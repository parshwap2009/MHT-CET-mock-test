<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - MHT-CET Mock Test</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            color: #2563eb;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }

        .bottom {
            text-align: center;
            margin-top: 22px;
            color: #667085;
        }

        .bottom a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        MHT-CET Test
    </div>

    <p class="subtitle">
        Create your student account
    </p>

    <form id="registerForm">

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
        >


        <button type="submit" id="registerButton">
            Create Account
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="bottom">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<script src="config.js"></script>

<script>

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    const form =
        document.getElementById("registerForm");

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("registerButton");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        message.textContent = "";
        message.className = "message";

        button.disabled = true;
        button.textContent = "Creating account...";


        try {

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {
                        data: {
                            full_name: name
                        }
                    }

                });


            if (error) {
                throw error;
            }


            message.textContent =
                "Account created successfully!";

            message.className =
                "message success";


            form.reset();


            /*
             * Depending on your Supabase email-confirmation
             * setting, the user may need to verify their email.
             */

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 2000);


        } catch (error) {

            console.error(error);

            message.textContent =
                error.message || "Registration failed.";

            message.className =
                "message error";

        } finally {

            button.disabled = false;
            button.textContent = "Create Account";

        }

    });

</script>

</body>
</html>
